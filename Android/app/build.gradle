plugins {
    id 'com.android.application'
}


android {

    namespace "com.neondrive.game"

    compileSdk 35


    defaultConfig {

        applicationId "com.neondrive.game"

        minSdk 26

        targetSdk 35

        versionCode 1

        versionName "1.0"


        externalNativeBuild {

            cmake {

                cppFlags "-std=c++20"

            }

        }

    }


    externalNativeBuild {

        cmake {

            path "src/main/cpp/CMakeLists.txt"

        }

    }

}
